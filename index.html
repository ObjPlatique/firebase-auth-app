<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Authentication</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <div class="auth-container">
            <!-- Login Card -->
            <div class="auth-card login-card">
                <h2>Login</h2>
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <input type="email" id="loginEmail" placeholder="Email" required>
                    </div>
                    <div class="form-group password-group">
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <button type="button" class="toggle-password" data-target="loginPassword">👁️</button>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <p class="auth-switch">
                    Don't have an account? <a href="#" onclick="switchToSignup(event)">Signup</a>
                </p>
                <div class="divider">Or</div>
                <button type="button" class="btn btn-social facebook">
                    📘 Login with Facebook
                </button>
                <button type="button" class="btn btn-social google" id="googleLoginBtn">
                    🔍 Login with Google
                </button>
            </div>

            <!-- Signup Card -->
            <div class="auth-card signup-card hidden">
                <h2>Signup</h2>
                <form id="signupForm" novalidate>
                    <div class="form-group">
                        <input type="email" id="signupEmail" placeholder="Email" required>
                    </div>
                    <div class="form-group password-group">
                        <input type="password" id="signupPassword" placeholder="Create password" required>
                        <button type="button" class="toggle-password" data-target="signupPassword">👁️</button>
                    </div>
                    <div class="form-group password-group">
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                        <button type="button" class="toggle-password" data-target="confirmPassword">👁️</button>
                    </div>
                    <button type="submit" class="btn btn-primary">Signup</button>
                </form>
                <p class="auth-switch">
                    Already have an account? <a href="#" onclick="switchToLogin(event)">Login</a>
                </p>
                <div class="divider">Or</div>
                <button type="button" class="btn btn-social facebook">
                    📘 Login with Facebook
                </button>
                <button type="button" class="btn btn-social google" id="googleSignupBtn">
                    🔍 Login with Google
                </button>
            </div>
        </div>
    </div>

    <!-- Message Box -->
    <div id="messageBox" class="message-box hidden" role="alert"></div>

    <!-- User Info -->
    <div id="userInfo" class="user-info hidden">
        <div class="user-content">
            <h3>Logged In Successfully</h3>
            <p id="userEmail"></p>
            <button type="button" class="btn btn-logout" onclick="handleLogout()">Logout</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
